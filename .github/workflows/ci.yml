name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # ruff 位于 dev 依赖组，必须安装 dev 依赖
      - run: uv sync --frozen
      - run: uv run ruff check app/ tests/ scripts/

  test:
    name: Backend Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/ -q
        env:
          DATABASE_URL: sqlite://
          JWT_SECRET_KEY: ci-secret-0123456789abcdef
          UPLOAD_DIR: /tmp/cr-uploads
          OSS_BUCKET_DIR: /tmp/cr-parsed

  frontend-build:
    name: Frontend Build (Vue3+TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build:
    name: Docker Images Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t contract-review-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t contract-review-frontend:ci ./frontend
      - name: Validate deployment configuration
        run: |
          touch .env
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.yml --profile observability config --quiet
          bash -n deploy/ship-release.sh
          bash -n deploy/remote-release.sh

  deploy:
    name: Deploy to Linux host
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-build, docker-build, rag-eval]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ship verified source and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT || 'deploy' }}
        run: bash deploy/ship-release.sh

  rag-eval:
    name: RAG Eval Gate (golden set)
    runs-on: ubuntu-latest
    env:
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Golden set static gate (no key required)
        run: uv run python scripts/check_golden.py
      - name: Full retrieval eval + metric gate (requires SILICONFLOW_API_KEY secret)
        if: env.SILICONFLOW_API_KEY != ''
        env:
          LLM_BASE_URL: https://api.siliconflow.cn/v1
          LLM_REVIEW_MODEL: ${{ vars.RAG_EVAL_LLM_MODEL || 'deepseek-ai/DeepSeek-V3.2' }}
          LLM_CHAT_MODEL: ${{ vars.RAG_EVAL_LLM_MODEL || 'deepseek-ai/DeepSeek-V3.2' }}
          LLM_INTENT_MODEL: ${{ vars.RAG_EVAL_LLM_MODEL || 'deepseek-ai/DeepSeek-V3.2' }}
          EMBEDDING_BASE_URL: https://api.siliconflow.cn/v1
          EMBEDDING_MODEL: BAAI/bge-m3
          RERANK_URL: https://api.siliconflow.cn/v1/rerank
          RERANK_MODEL: BAAI/bge-reranker-v2-m3
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          DATABASE_URL: sqlite://
          JWT_SECRET_KEY: ci-secret-0123456789abcdef
          OSS_BUCKET_DIR: /tmp/cr-parsed
        run: |
          uv run python scripts/ingest_kb.py
          uv run python scripts/eval_rag.py | tee /tmp/eval.out
          uv run python scripts/gate_metrics.py --recall5 0.6 --mrr 0.4 --ndcg 0.5
      - name: Skip notice (no secret configured)
        if: env.SILICONFLOW_API_KEY == ''
        run: echo "::notice::SILICONFLOW_API_KEY secret 未配置，跳过完整检索评测（静态门禁已通过）；配置 secret 后自动成为指标门禁"
